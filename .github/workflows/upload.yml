name: Upload component

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  upload_components:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version: *"\(.*\)"/\1/p' PipCore/idf_component.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Upload to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "pipcore: PipCore"
          namespace: "pisppus"
